
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AfriTrucks - Zambia Run</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  overflow:hidden;
  background:#101820;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}
#game{position:fixed;inset:0}
canvas{display:block}

#brand{
 position:absolute;top:12px;left:12px;
 font-weight:900;font-size:19px;
 letter-spacing:2px;color:#ffc400;
 text-shadow:2px 2px 5px #000;
 pointer-events:none;
}
#mission{
 position:absolute;top:45px;left:12px;
 background:#101820cc;padding:9px;
 border-left:3px solid #ffc400;
 font-size:11px;pointer-events:none;
}
#hud{
 position:absolute;top:12px;right:10px;
 background:#101820dd;padding:10px;
 border-radius:8px;text-align:right;
 min-width:120px;pointer-events:none;
}
#speed{font-size:30px;font-weight:bold;color:#ffc400}
#unit{font-size:10px;color:#aaa}
#rpmbar{height:7px;background:#444;margin-top:7px;border-radius:5px}
#rpmfill{height:100%;width:0%;background:#ffc400;border-radius:5px}
#gearDisplay{font-size:23px;font-weight:bold;margin-top:5px}
#stats{font-size:11px;line-height:19px;color:#ddd}

#controls{
 position:absolute;bottom:12px;left:0;right:0;
 display:flex;justify-content:space-between;
 align-items:flex-end;padding:0 12px;
 pointer-events:none;
}
.group{display:flex;gap:9px;align-items:flex-end}
.control{
 pointer-events:auto;
 width:65px;height:65px;
 border:1px solid #ffffff66;
 border-radius:14px;
 background:#182633dd;color:white;
 font-weight:bold;font-size:12px;
 touch-action:none;
 user-select:none;
}
.control:active,.control.active{background:#bd8500}
.pedal{height:85px;width:62px}
#gas{background:#166b39dd}
#brake{background:#922b2bdd}
#clutch{background:#344b75dd}
#steerleft,#steerright{font-size:25px}
#gearUp,#gearDown{height:42px;width:48px}
#restart{height:43px;width:75px;background:#17633c}
#camera{height:43px;width:75px}
#settings{
 position:absolute;top:100px;right:10px;
 background:#101820eF;padding:12px;
 border-radius:10px;width:180px;
 font-size:12px;
}
#settings button,#settings select{
 width:100%;padding:8px;margin-top:6px;
 background:#263746;color:white;
 border:1px solid #777;border-radius:5px;
}
#settings label{display:block;margin-top:9px}
#settings.hidden{display:none}
#menuBtn{
 position:absolute;top:100px;left:12px;
 padding:8px 12px;background:#182633dd;
 color:white;border:1px solid #aaa;
 border-radius:6px;
}
#message{
 position:absolute;top:45%;left:50%;
 transform:translate(-50%,-50%);
 background:#101820dd;padding:15px 22px;
 border-radius:10px;text-align:center;
 display:none;pointer-events:none;
}
#startScreen{
 position:absolute;inset:0;
 background:linear-gradient(#101820cc,#101820ee);
 display:flex;align-items:center;
 justify-content:center;flex-direction:column;
 text-align:center;z-index:10;
}
#startScreen h1{font-size:35px;color:#ffc400}
#startScreen p{margin:12px;color:#ddd}
#startScreen button{
 background:#e5a900;color:#111;
 border:0;padding:15px 35px;
 border-radius:8px;font-weight:bold;
 font-size:17px;margin-top:15px;
}
.small{font-size:10px;color:#aaa}
@media(max-height:450px){
 .control{width:55px;height:53px}
 .pedal{height:67px}
 #hud{transform:scale(.85);transform-origin:top right}
}
</style>
</head>

<body>
<div id="game"></div>

<div id="brand">AFRITRUCKS</div>

<div id="mission">
 ZAMBIA RUN<br>
 <b>DELIVERY 01</b><br>
 Great North Road
</div>

<div id="hud">
 <div id="speed">0</div>
 <div id="unit">KM/H</div>
 <div id="gearDisplay">N</div>
 <div id="stats">
  RPM: <span id="rpm">800</span><br>
  FUEL: <span id="fuel">100</span>%<br>
  ENGINE: <span id="engineStatus">OFF</span>
 </div>
 <div id="rpmbar"><div id="rpmfill"></div></div>
</div>

<button id="menuBtn">SETTINGS</button>

<div id="settings" class="hidden">
 <b>DRIVING SETTINGS</b>
 <label>Transmission</label>
 <select id="transmission">
  <option value="manual">Manual 12-Speed</option>
  <option value="auto">Automatic</option>
 </select>
 <label>Driving camera</label>
 <select id="cameraSelect">
  <option value="chase">Chase Camera</option>
  <option value="cabin">Cabin Camera</option>
 </select>
 <button id="closeSettings">CLOSE</button>
</div>

<div id="controls">
 <div class="group">
  <button class="control" id="steerleft">◀</button>
  <button class="control" id="steerright">▶</button>
 </div>

 <div class="group">
  <button class="control" id="gearDown">G-</button>
  <button class="control" id="gearUp">G+</button>
  <button class="control" id="clutch">CLUTCH</button>
 </div>

 <div class="group">
  <button class="control pedal" id="brake">BRAKE</button>
  <button class="control pedal" id="gas">GAS</button>
 </div>
</div>

<div style="position:absolute;bottom:105px;left:12px;display:flex;gap:7px">
 <button class="control" id="restart">START</button>
 <button class="control" id="camera">CAMERA</button>
</div>

<div id="message"></div>

<div id="startScreen">
 <h1>AFRITRUCKS</h1>
 <p>ZAMBIA RUN • TRUCK SIMULATOR</p>
 <p class="small">12-SPEED MANUAL • AUTOMATIC • CARGO DELIVERY</p>
 <button id="startGame">START DRIVING</button>
 <p class="small">Designed for Android Chrome</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
"use strict";

// ======================================
// AFRITRUCKS - MAIN GAME
// ======================================

const game=document.getElementById("game");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83bce5);
scene.fog=new THREE.Fog(0x83bce5,100,650);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,1500
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
game.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xc9e6ff,0x80603b,2));

const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-100,150,80);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

// MATERIALS
function material(color,roughness=0.85){
 return new THREE.MeshStandardMaterial({
  color,roughness
 });
}

const roadMat=material(0x303234);
const groundMat=material(0x9a804c);
const whiteMat=material(0xffffff);
const blackMat=material(0x17191c);
const rubberMat=material(0x090909);
const metalMat=material(0x777e85);
const glassMat=new THREE.MeshStandardMaterial({
 color:0x25485c,metalness:0.3,roughness:0.2
});

// OBJECT HELPERS
function box(parent,w,h,d,x,y,z,mat){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

function cylinder(parent,r1,r2,length,x,y,z,mat){
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,length,16),
  mat
 );
 mesh.position.set(x,y,z);
 mesh.rotation.x=Math.PI/2;
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}

// ======================================
// ENVIRONMENT
// ======================================

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(3000,3000),
 groundMat
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.12;
ground.receiveShadow=true;
scene.add(ground);

// Road
const road=box(scene,15,0.15,3000,0,0,0,roadMat);
road.receiveShadow=true;

// Road shoulders
box(scene,2,0.17,3000,-8.5,0,0,material(0xb0a078));
box(scene,2,0.17,3000,8.5,0,0,material(0xb0a078));

// Road markings
const lines=[];
for(let z=-1450;z<1500;z+=25){
 const line=box(scene,0.17,0.03,11,0,0.095,z,whiteMat);
 lines.push(line);
}

// Roadside scenery
const scenery=[];

function makeTree(x,z){
 const tree=new THREE.Group();

 const trunk=box(
  tree,0.65,5,0.65,0,2.5,0,
  material(0x604025)
 );

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(3.2,9,7),
  material(0x416b2b)
 );
 leaves.position.y=6;
 leaves.scale.set(1.5,0.7,1);
 leaves.castShadow=true;
 tree.add(leaves);

 tree.position.set(x,0,z);
 scene.add(tree);
 scenery.push(tree);
}

function makeBush(x,z){
 const bush=new THREE.Mesh(
  new THREE.DodecahedronGeometry(1.7,0),
  material(0x58702c)
 );
 bush.position.set(x,0.9,z);
 scene.add(bush);
 scenery.push(bush);
}

function makeHouse(x,z){
 const house=new THREE.Group();

 box(house,7,4,7,0,2,0,material(0xb8a17b));

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(5.6,3,4),
  material(0x75472b)
 );
 roof.position.y=5.5;
 roof.rotation.y=Math.PI/4;
 roof.castShadow=true;
 house.add(roof);

 box(house,1.4,2,0.12,0,1,3.56,material(0x503421));

 house.position.set(x,0,z);
 scene.add(house);
 scenery.push(house);
}

for(let z=-1400;z<1450;z+=32){
 makeTree(-17-Math.random()*20,z);
 makeTree(17+Math.random()*20,z-12);
 if(Math.random()>0.5)makeBush(-12,z+8);
 if(Math.random()>0.5)makeBush(12,z-8);
}

for(let z=-1000;z<1200;z+=240){
 makeHouse(-35,z);
}

// Mountains in the distance
for(let i=0;i<18;i++){
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(80+Math.random()*70,
  90+Math.random()*100,5),
  material(0x71845e)
 );
 mountain.position.set(
  (Math.random()>0.5?1:-1)*(140+Math.random()*150),
  35,
  -1100+Math.random()*2200
 );
 scene.add(mountain);
}

// ======================================
// TRUCK MODEL
// ======================================

const truck=new THREE.Group();
scene.add(truck);

// Main chassis
box(truck,3.1,0.65,10,0,1.25,0,blackMat);

// CAB
const cab=new THREE.Group();
truck.add(cab);

// Lower cab
box(cab,3.5,2.0,4,0,2.7,0,material(0xc52520));

// Engine hood
box(cab,3.45,1.0,1.3,0,2.3,-2.45,material(0x9f1d1a));

// Roof
box(cab,3.45,0.3,3.8,0,4.0,0,material(0xc52520));

// Front windshield
box(cab,3.05,1.35,0.12,0,3.35,-1.96,glassMat);

// Rear window
box(cab,2.5,0.9,0.12,0,3.25,1.95,glassMat);

// Side windows
box(cab,0.08,1.15,2.6,-1.77,3.35,0,glassMat);
box(cab,0.08,1.15,2.6,1.77,3.35,0,glassMat);

// Mirrors
box(cab,0.15,0.9,0.2,-2,3.1,-1.2,blackMat);
box(cab,0.15,0.9,0.2,2,3.1,-1.2,blackMat);

// Front bumper
box(cab,3.7,0.45,0.35,0,1.45,-3.2,metalMat);

// Front grille
box(cab,1.3,0.8,0.1,0,2.25,-3.12,blackMat);

// Headlights
box(cab,0.65,0.45,0.15,-1.25,2.1,-3.13,whiteMat);
box(cab,0.65,0.45,0.15,1.25,2.1,-3.13,whiteMat);

// Front wheels
function makeWheel(parent,x,y,z){
 const wheel=new THREE.Mesh(
  new THREE.CylinderGeometry(0.85,0.85,0.55,24),
  rubberMat
 );
 wheel.rotation.z=Math.PI/2;
 wheel.position.set(x,y,z);
 wheel.castShadow=true;
 parent.add(wheel);

 const hub=new THREE.Mesh(
  new THREE.CylinderGeometry(0.4,0.4,0.58,20),
  metalMat
 );
 hub.rotation.z=Math.PI/2;
 hub.position.copy(wheel.position);
 parent.add(hub);
 return wheel;
}

const wheels=[];

for(const x of [-1.85,1.85]){
 wheels.push(makeWheel(truck,x,1.05,-2.2));
 wheels.push(makeWheel(truck,x,1.05,2.7));
 wheels.push(makeWheel(truck,x,1.05,3.8));
}

// Trailer
const trailer=new THREE.Group();
truck.add(trailer);

box(trailer,2.9,4.4,13,0,4.0,10,material(0xe0e0dc));
box(trailer,3.0,0.25,13,0,1.65,10,metalMat);
box(trailer,3.0,0.2,13,0,6.25,10,whiteMat);

// Trailer rear doors
box(trailer,2.7,3.9,0.1,0,4,16.55,whiteMat);
box(trailer,0.1,3.8,0.12,-0.7,4,16.62,metalMat);
box(trailer,0.1,3.8,0.12,0.7,4,16.62,metalMat);

// Trailer wheels
for(const x of [-1.65,1.65]){
 wheels.push(makeWheel(trailer,x,1.0,12.7));
 wheels.push(makeWheel(trailer,x,1.0,14.1));
}

// Trailer rear lights
box(trailer,0.3,0.4,0.15,-1,2.3,16.65,material(0xff0000));
box(trailer,0.3,0.4,0.15,1,2.3,16.65,material(0xff0000));

// ======================================
// CABIN INTERIOR
// ======================================

const cabinInterior=new THREE.Group();
truck.add(cabinInterior);

// Dashboard
box(cabinInterior,2.9,0.35,1.1,0,3.05,-0.65,blackMat);

// Driver seat
box(cabinInterior,0.9,1.4,0.8,-0.8,2.5,0.8,material(0x292929));

// Passenger seat
box(cabinInterior,0.9,1.4,0.8,0.8,2.5,0.8,material(0x292929));

// Steering wheel
const steering=new THREE.Mesh(
 new THREE.TorusGeometry(0.48,0.06,8,24),
 blackMat
);
steering.position.set(-0.8,3.45,-0.3);
cabinInterior.add(steering);

// Gear lever
const lever=new THREE.Mesh(
 new THREE.CylinderGeometry(0.055,0.07,0.65,8),
 metalMat
);
lever.position.set(0.45,3.35,0.1);
cabinInterior.add(lever);

// ======================================
// GAME PHYSICS
// ======================================

let speed=0;
let rpm=800;
let fuel=100;
let currentGear=0;
let clutch=1;
let engineOn=false;
let started=false;
let steeringValue=0;
let distance=0;
let transmission="manual";
let cameraMode="chase";

let throttle=0;
let braking=0;

const held={
 gas:false,
 brake:false,
 left:false,
 right:false,
 clutch:false
};

const ratios=[
 0,
 12.5,8.5,6.1,4.5,3.5,2.8,
 2.25,1.8,1.45,1.18,0.98,0.82
];

const finalDrive=3.5;
const wheelRadius=0.52;
const maxRPM=2400;
const idleRPM=800;

function setMessage(text){
 const m=document.getElementById("message");
 m.textContent=text;
 m.style.display="block";
 clearTimeout(setMessage.timer);
 setMessage.timer=setTimeout(()=>{
  m.style.display="none";
 },2000);
}

function startEngine(){
 if(engineOn){
  setMessage("ENGINE ALREADY RUNNING");
  return;
 }

 if(speed>1){
  setMessage("STOP THE TRUCK FIRST");
  return;
 }

 if(transmission==="manual"&&currentGear!==0&&clutch<0.8){
  setMessage("SELECT NEUTRAL OR PRESS CLUTCH");
  return;
 }

 engineOn=true;
 rpm=idleRPM;
 setMessage("ENGINE STARTED");
}

function stopEngine(){
 engineOn=false;
 rpm=0;
 setMessage("ENGINE STOPPED");
}

function changeGear(direction){
 if(transmission==="auto")return;

 if(!engineOn&&speed===0){
  if(currentGear+direction>=0&&currentGear+direction<=12){
   currentGear+=direction;
  }
  return;
 }

 if(clutch<0.65){
  setMessage("PRESS CLUTCH TO CHANGE GEAR");
  return;
 }

 const next=currentGear+direction;

 if(next<0||next>12)return;

 currentGear=next;
}

function automaticGear(){
 if(!engineOn)return;

 if(speed<1){
  currentGear=1;
  return;
 }

 if(rpm>2200&&currentGear<12){
  currentGear++;
 }

 if(rpm<1100&&currentGear>1){
  currentGear--;
 }
}

// Physics update
function updatePhysics(dt){

 const gas=held.gas?1:0;
 const brake=held.brake?1:0;

 throttle=gas;
 braking=brake;

 if(!engineOn){
  rpm=Math.max(0,rpm-1000*dt);
  speed=Math.max(0,speed-2*dt);
 }else{

  const targetIdle=idleRPM+gas*1100;

  rpm+=(targetIdle-rpm)*Math.min(1,dt*4);

  if(transmission==="auto"){
   automaticGear();
   clutch=1;
  }

  const gear=ratios[currentGear]||0;

  let engineLoad=0;
  let drive=0;

  if(transmission==="manual"){

   if(currentGear===0){
    drive=0;
   }else if(clutch<0.45){
    engineLoad=gas*900;
    drive=gas*(1-clutch)*gear*0.00022;
   }else{
    drive=0;
   }

   // Clutch disengaged = engine free to rev
   if(clutch>0.6){
    rpm+=(idleRPM+gas*1200-rpm)*dt*5;
   }else if(currentGear>0&&speed<5&&gas>0){
    rpm-=850*dt;
   }

   // Engine stalling
   if(currentGear>0&&clutch<0.25&&speed<3&&gas<0.2){
    rpm-=650*dt;
   }

   if(rpm<450){
    rpm=0;
    engineOn=false;
    setMessage("ENGINE STALLED! PRESS START");
   }

  }else{
   const ratio=ratios[currentGear]||0;
   drive=gas*ratio*0.00022;
   engineLoad=gas*300;
  }

  if(currentGear===0&&transmission==="manual"){
   drive=0;
  }

  // RPM follows road speed when clutch is engaged
  if(currentGear>0&&clutch<0.5&&speed>2){
   const calculatedRPM=
    speed*gear*finalDrive*42;
   rpm+=(calculatedRPM-rpm)*Math.min(1,dt*3);
  }

  rpm=THREE.MathUtils.clamp(rpm,0,maxRPM);

  // Heavy truck acceleration
  speed+=drive*dt*60;

  if(gas===0&&speed>0){
   speed-=0.12*dt;
  }

  speed-=brake*12*dt;

  // Rolling resistance
  speed-=Math.max(0,speed)*0.018*dt;

  speed=Math.max(0,Math.min(speed,135));

  fuel-=gas*dt*0.012;
  fuel=Math.max(0,fuel);

  if(fuel<=0){
   engineOn=false;
   setMessage("OUT OF FUEL");
  }
 }

 // Steering
 const steeringInput=(held.right?1:0)-(held.left?1:0);
 steeringValue+=(steeringInput-steeringValue)*Math.min(1,dt*5);

 if(speed>0.1){
  truck.rotation.y-=steeringValue*dt*
   Math.min(speed/25,1)*0.65;
 }

 // Truck movement
 const movement=speed*dt*0.38;

 truck.position.x+=Math.sin(truck.rotation.y)*movement;
 truck.position.z-=Math.cos(truck.rotation.y)*movement;

 distance+=movement;

 // Wheel rotation
 for(const wheel of wheels){
  wheel.rotation.x-=movement/wheelRadius;
 }

 // Steering wheel
 steering.rotation.z=-steeringValue*0.8;

 // Limit road position
 truck.position.x=THREE.MathUtils.clamp(
  truck.position.x,-5.1,5.1
 );

 // Endless scenery
 if(truck.position.z<-650){
  truck.position.z+=1300;

  for(const obj of scenery){
   obj.position.z+=1300;
  }

  for(const line of lines){
   line.position.z+=1300;
  }
 }

}

// ======================================
// CAMERAS
// ======================================

function updateCamera(){

 if(cameraMode==="chase"){

  const behind=new THREE.Vector3(
   Math.sin(truck.rotation.y)*16,
   9,
   Math.cos(truck.rotation.y)*16
  );

  const target=truck.position.clone();
  const desired=truck.position.clone().add(behind);

  camera.position.lerp(desired,0.08);

  const look=target.clone();
  look.y+=2.5;
  look.z-=5;

  camera.lookAt(look);

 }else{

  const cabinPosition=new THREE.Vector3(
   -0.55,3.65,-0.3
  );

  cabinPosition.applyAxisAngle(
   new THREE.Vector3(0,1,0),truck.rotation.y
  );

  camera.position.copy(truck.position).add(cabinPosition);

  const direction=new THREE.Vector3(
   Math.sin(truck.rotation.y),
   -0.02,
   -Math.cos(truck.rotation.y)
  );

  camera.lookAt(
   camera.position.clone().add(direction.multiplyScalar(30))
  );
 }
}

// ======================================
// HUD
// ======================================

function updateHUD(){

 document.getElementById("speed").textContent=
  Math.round(speed*1.1);

 document.getElementById("rpm").textContent=
  Math.round(rpm);

 document.getElementById("fuel").textContent=
  Math.round(fuel);

 document.getElementById("gearDisplay").textContent=
  currentGear===0?"N":currentGear;

 document.getElementById("engineStatus").textContent=
  engineOn?"RUNNING":"OFF";

 document.getElementById("rpmfill").style.width=
  Math.min(100,rpm/maxRPM*100)+"%";

 document.getElementById("mission").innerHTML=
  "ZAMBIA RUN<br><b>DELIVERY 01</b><br>"+
  "Distance: "+Math.floor(distance/1000)+" km";

}

// ======================================
// TOUCH CONTROLS
// ======================================

function holdButton(id,key){

 const el=document.getElementById(id);

 el.addEventListener("pointerdown",e=>{

 "pointerdown",()=>{
  held.clutch=true;
  clutch=0;
  document.getElementById("clutch").classList.add("active");
 }

 held.clutch=false;
 clutch=1;
 document.getElementById("clutch").classList.remove("active");
}

document.getElementById("clutch").addEventListener(
 "pointerup",releaseClutch
);
document.getElementById("clutch").addEventListener(
 "pointercancel",releaseClutch
);

 "lostpointercapture",releaseClutch
);
